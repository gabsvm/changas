name: Phase02 Format Debug

on:
  push:
    branches: ["codex/phase-02-provider-marketplace"]

permissions:
  contents: write

jobs:
  format-debug:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-02-provider-marketplace
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact closeout files
        run: |
          pnpm exec prettier --write \
            'apps/web/src/app/(provider)/service-actions.ts' \
            'docs/superpowers/plans/2026-08-31-phase02-closeout-and-phase03-discovery.md' \
            'tests/e2e/phase-02-public-surfaces.spec.ts'
      - name: Commit exact formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            'apps/web/src/app/(provider)/service-actions.ts' \
            'docs/superpowers/plans/2026-08-31-phase02-closeout-and-phase03-discovery.md' \
            'tests/e2e/phase-02-public-surfaces.spec.ts'
          git commit -m 'style(phase02): apply exact prettier output'
          git push origin HEAD:codex/phase-02-provider-marketplace
