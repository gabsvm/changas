name: Phase04 Format E2E

on:
  push:
    branches:
      - codex/phase-04-conversations

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write tests/e2e/phase-04-conversations.spec.ts
      - name: Commit formatted spec
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/phase-04-conversations.spec.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(conversations): format phase 04 e2e"
          git push
