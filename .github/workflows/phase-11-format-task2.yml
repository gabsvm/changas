name: Phase 11 Task 2 Format

on:
  push:

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[format-task2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-11-payments
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Task 2 files
        run: pnpm exec prettier --write packages/config/src/payment-server-env.ts packages/config/src/payment-server-env.test.ts
      - name: Commit exact formatting and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/phase-11-format-task2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/config/src/payment-server-env.ts packages/config/src/payment-server-env.test.ts .github/workflows/phase-11-format-task2.yml
          git commit -m "style(phase11): apply exact payment config formatting"
          git push origin HEAD:codex/phase-11-payments
