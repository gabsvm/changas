name: Phase04 Format Chat

on:
  push:
    branches:
      - codex/phase-04-conversations

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format current Phase 04 files
        run: |
          pnpm exec prettier --write \
            'apps/web/src/app/(account)/messages/actions.test.ts' \
            'apps/web/src/app/(account)/messages/actions.ts' \
            apps/web/src/lib/conversations/server.ts \
            packages/domain/src/outgoing-message.ts \
            packages/domain/src/realtime-messages.ts \
            packages/domain/src/realtime-messages.test.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            'apps/web/src/app/(account)/messages/actions.test.ts' \
            'apps/web/src/app/(account)/messages/actions.ts' \
            apps/web/src/lib/conversations/server.ts \
            packages/domain/src/outgoing-message.ts \
            packages/domain/src/realtime-messages.ts \
            packages/domain/src/realtime-messages.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(conversations): format chat implementation"
          git push
