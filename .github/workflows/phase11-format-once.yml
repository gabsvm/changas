name: Phase 11 one-time formatter

on:
  push:
    branches:
      - codex/phase-11-payments

permissions:
  contents: write

jobs:
  format-once:
    if: ${{ !contains(github.event.head_commit.message, '[skip format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 11 payment files
        run: pnpm exec prettier --write apps/web/src/lib/payments/server.ts apps/web/src/lib/payments/server.test.ts apps/web/src/lib/payments/webhook.test.ts apps/web/src/lib/payments/oauth-state.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/payments/server.ts apps/web/src/lib/payments/server.test.ts apps/web/src/lib/payments/webhook.test.ts apps/web/src/lib/payments/oauth-state.ts
          git commit -m "style(phase11): format payment orchestration [skip format]"
          git push origin HEAD:codex/phase-11-payments
