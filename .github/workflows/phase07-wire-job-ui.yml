name: Phase 07 job UI one-shot

on:
  push:
    branches:
      - codex/phase-07-reputation

permissions:
  contents: write

jobs:
  wire-job-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/phase-07-reputation

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wire panel and format Phase 07 UI
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/web/src/app/(account)/jobs/[jobId]/page.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const importAnchor = 'import { formatMinorUnits, type JobStatus } from "@changas/domain";\n\n';
          const importLine = 'import { JobReputationPanel } from "@/components/reputation/job-reputation-panel";\n';
          if (!source.includes(importLine)) {
            if (!source.includes(importAnchor)) throw new Error('Job page import anchor not found');
            source = source.replace(importAnchor, importAnchor + importLine);
          }
          const layoutAnchor = '</section>\n\n      <div className="mt-5 grid gap-5 lg:grid-cols-[1.2fr_.8fr]">';
          const panel = '</section>\n\n      <JobReputationPanel\n        jobId={jobId}\n        status={detail.job_status}\n        isClient={isClient}\n        isProvider={isProvider}\n      />\n\n      <div className="mt-5 grid gap-5 lg:grid-cols-[1.2fr_.8fr]">';
          if (!source.includes('<JobReputationPanel')) {
            if (!source.includes(layoutAnchor)) throw new Error('Job page layout anchor not found');
            source = source.replace(layoutAnchor, panel);
          }
          fs.writeFileSync(path, source);
          NODE
          pnpm exec prettier --write \
            apps/web/src/lib/reputation/server.ts \
            apps/web/src/lib/reputation/server-job-actions.test.ts \
            'apps/web/src/app/(account)/jobs/actions.ts' \
            apps/web/src/components/reputation/job-reputation-panel.tsx \
            'apps/web/src/app/(account)/account/favorites/page.tsx' \
            'apps/web/src/app/(account)/jobs/[jobId]/page.tsx'
          git diff --check
          if git diff --quiet -- \
            apps/web/src/lib/reputation/server.ts \
            apps/web/src/lib/reputation/server-job-actions.test.ts \
            'apps/web/src/app/(account)/jobs/actions.ts' \
            apps/web/src/components/reputation/job-reputation-panel.tsx \
            'apps/web/src/app/(account)/account/favorites/page.tsx' \
            'apps/web/src/app/(account)/jobs/[jobId]/page.tsx'; then
            echo "Phase 07 UI already wired and formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/lib/reputation/server.ts \
            apps/web/src/lib/reputation/server-job-actions.test.ts \
            'apps/web/src/app/(account)/jobs/actions.ts' \
            apps/web/src/components/reputation/job-reputation-panel.tsx \
            'apps/web/src/app/(account)/account/favorites/page.tsx' \
            'apps/web/src/app/(account)/jobs/[jobId]/page.tsx'
          git commit -m "feat(phase07): wire completed job reputation UI"
          git push origin HEAD:codex/phase-07-reputation
