name: Phase04 Format Runtime

on:
  push:
    branches:
      - codex/phase-04-conversations

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 04 runtime
        run: pnpm exec prettier --write apps/web/scripts/phase-04-conversations-runtime.mjs
      - name: Commit formatted runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/scripts/phase-04-conversations-runtime.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(conversations): format phase 04 runtime"
          git push
