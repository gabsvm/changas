name: Phase 09 Diagnostic

on:
  push:
    branches: ["codex/diag-prettier-phase09"]

permissions:
  contents: read

jobs:
  diagnose-service-insert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Start local Supabase
        run: pnpm dlx supabase@2.116.0 start --exclude edge-runtime

      - name: Reset local database with seed
        run: pnpm dlx supabase@2.116.0 db reset --local

      - name: Export local Supabase credentials
        shell: bash
        run: |
          pnpm dlx supabase@2.116.0 status -o env > "$RUNNER_TEMP/supabase.env"
          set -a
          source "$RUNNER_TEMP/supabase.env"
          set +a
          {
            echo "API_URL=$API_URL"
            echo "SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Reproduce isolated moderation service insert
        shell: bash
        run: |
          node <<'NODE'
          const apiUrl = process.env.API_URL;
          const key = process.env.SERVICE_ROLE_KEY;
          const headers = {
            apikey: key,
            Authorization: `Bearer ${key}`,
            "Content-Type": "application/json",
            Prefer: "return=representation",
          };
          const suffix = crypto.randomUUID();
          const email = `phase09-diag-${suffix}@example.test`;
          const password = `Phase09-${suffix}-Password!`;

          let response = await fetch(`${apiUrl}/auth/v1/admin/users`, {
            method: "POST",
            headers,
            body: JSON.stringify({
              email,
              password,
              email_confirm: true,
              user_metadata: { display_name: "Prestador Moderación Diagnostic" },
            }),
          });
          const userText = await response.text();
          console.log("AUTH", response.status, userText);
          if (!response.ok) process.exit(2);
          const user = JSON.parse(userText);

          const slugSuffix = crypto.randomUUID().replaceAll("-", "");
          response = await fetch(`${apiUrl}/rest/v1/provider_profiles`, {
            method: "POST",
            headers,
            body: JSON.stringify({
              user_id: user.id,
              status: "ACTIVE",
              onboarding_step: 4,
              public_slug: `phase09-moderation-${slugSuffix}`,
              marketplace_paused: false,
              availability_paused: false,
            }),
          });
          console.log("PROVIDER", response.status, await response.text());
          if (!response.ok) process.exit(3);

          response = await fetch(
            `${apiUrl}/rest/v1/skills?select=id&is_active=eq.true&order=sort_order.asc&limit=1`,
            { headers },
          );
          const skillsText = await response.text();
          console.log("SKILLS", response.status, skillsText);
          if (!response.ok) process.exit(4);
          const skillId = JSON.parse(skillsText)[0]?.id;
          if (!skillId) process.exit(5);

          const serviceId = crypto.randomUUID();
          response = await fetch(`${apiUrl}/rest/v1/services`, {
            method: "POST",
            headers,
            body: JSON.stringify({
              id: serviceId,
              provider_user_id: user.id,
              skill_id: skillId,
              public_slug: `phase09-service-${slugSuffix}`,
              title: `Servicio aislado Phase 09 ${slugSuffix.slice(0, 8)}`,
              description:
                "Servicio sintético aislado para validar moderación administrativa sin alterar el catálogo demo compartido.",
              modality: "REMOTE",
              price_model: "FIXED",
              price_amount: 15000,
              schedule_type: "UNSCHEDULED",
              is_published: false,
              is_paused: false,
            }),
          });
          const serviceText = await response.text();
          console.log("SERVICE", response.status, serviceText);
          if (!response.ok) process.exit(6);
          NODE

      - name: Stop local Supabase
        if: always()
        run: pnpm dlx supabase@2.116.0 stop
