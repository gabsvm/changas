name: Phase 08 Delivery Runtime Format Probe

on:
  push:
    branches: ["codex/phase-08-format-probe"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format delivery runtime
        run: |
          pnpm exec prettier --write apps/web/scripts/phase-08-delivery-policy-runtime.mjs
          git diff --no-ext-diff --unified=3 -- apps/web/scripts/phase-08-delivery-policy-runtime.mjs
