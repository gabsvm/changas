name: Phase 08 Delivery Runtime Format Probe

on:
  push:
    branches: ["codex/phase-08-format-probe"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and persist delivery runtime
        shell: bash
        run: |
          pnpm exec prettier --write apps/web/scripts/phase-08-delivery-policy-runtime.mjs
          if git diff --quiet -- apps/web/scripts/phase-08-delivery-policy-runtime.mjs; then
            echo "Runtime already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/scripts/phase-08-delivery-policy-runtime.mjs
          git commit -m "style(phase08): format delivery policy runtime"
          git push origin HEAD:codex/phase-08-format-probe
