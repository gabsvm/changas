name: Phase 07 formatting one-shot

on:
  push:
    branches:
      - codex/phase-07-reputation

permissions:
  contents: write

jobs:
  format-rehire-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/phase-07-reputation

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and commit runtime
        run: |
          pnpm exec prettier --write apps/web/scripts/phase-07-rehire-runtime.mjs
          if git diff --quiet -- apps/web/scripts/phase-07-rehire-runtime.mjs; then
            echo "Runtime already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/scripts/phase-07-rehire-runtime.mjs
          git commit -m "style(phase07): format rehire runtime"
          git push origin HEAD:codex/phase-07-reputation
