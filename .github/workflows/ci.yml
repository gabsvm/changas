name: Phase 08 Report Format Probe

on:
  push:
    branches: ["codex/phase-08-report-format-probe"]

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show exact Prettier diff
        run: |
          pnpm exec prettier --write docs/reports/phase-08-notifications.md
          git diff -- docs/reports/phase-08-notifications.md
