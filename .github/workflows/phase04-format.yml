name: Phase04 Format

on:
  push:
    branches:
      - codex/phase-04-conversations

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/superpowers/plans/2026-08-31-phase-04-conversations.md supabase/tests/phase-04-conversations.sql
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-08-31-phase-04-conversations.md supabase/tests/phase-04-conversations.sql
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(phase04): format plan and schema contract"
          git push
