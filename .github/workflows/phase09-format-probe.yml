name: Phase09 format probe

on:
  push:
    branches:
      - codex/phase09-runtime-format-probe

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/scripts/phase-09-admin-runtime.mjs
      - name: Commit formatted runtime when needed
        run: |
          if git diff --quiet -- apps/web/scripts/phase-09-admin-runtime.mjs; then
            exit 0
          fi
          git config user.name "gabsvm"
          git config user.email "53277787+gabsvm@users.noreply.github.com"
          git add apps/web/scripts/phase-09-admin-runtime.mjs
          git commit -m "style(phase09): format catalog moderation runtime"
          git push
