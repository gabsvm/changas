name: Phase 09 format probe

on:
  push:
    branches:
      - codex/phase-09-identity-format-probe

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact Phase 09 files
        run: pnpm exec prettier --write apps/web/scripts/phase-09-admin-runtime.mjs apps/web/src/lib/admin/identity.ts
      - name: Commit formatted probe
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/scripts/phase-09-admin-runtime.mjs apps/web/src/lib/admin/identity.ts
          git commit -m "style(phase09): apply prettier to identity review"
          git push
