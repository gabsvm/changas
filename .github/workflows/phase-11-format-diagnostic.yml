name: Phase 11 Format Diagnostic

on:
  push:
    branches:
      - codex/phase-11-payments

permissions:
  contents: read

jobs:
  format:
    if: contains(github.event.head_commit.message, '[format-diagnostic]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format target files
        run: >-
          pnpm exec prettier --write
          docs/decisions/payment-provider.md
          docs/superpowers/plans/2026-09-05-phase-11-payments.md
          docs/superpowers/specs/2026-09-05-phase-11-payments-design.md
          packages/domain/src/payment-finance.test.ts
          packages/domain/src/payment-finance.ts
      - name: Emit exact formatted files
        shell: bash
        run: |
          for file in \
            docs/decisions/payment-provider.md \
            docs/superpowers/plans/2026-09-05-phase-11-payments.md \
            docs/superpowers/specs/2026-09-05-phase-11-payments-design.md \
            packages/domain/src/payment-finance.test.ts \
            packages/domain/src/payment-finance.ts
          do
            echo "FORMAT_FILE_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "FORMAT_FILE_END:$file"
          done
