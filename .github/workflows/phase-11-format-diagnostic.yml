name: Phase 11 Format Apply

on:
  push:
    branches:
      - codex/phase-11-payments

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[format-apply]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 11 artifacts
        run: >-
          pnpm exec prettier --write
          docs/decisions/payment-provider.md
          docs/superpowers/plans/2026-09-05-phase-11-payments.md
          docs/superpowers/specs/2026-09-05-phase-11-payments-design.md
          packages/domain/src/payment-finance.test.ts
          packages/domain/src/payment-finance.ts
      - name: Commit exact formatting and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/phase-11-format-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(phase11): format implementation artifacts"
          git push origin HEAD:codex/phase-11-payments
