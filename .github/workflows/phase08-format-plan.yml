name: Phase 08 format plan

on:
  push:
    branches:
      - codex/phase-08-notifications

permissions:
  contents: write

jobs:
  format-plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/superpowers/plans/2026-09-02-phase-08-notifications-pwa.md
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet -- docs/superpowers/plans/2026-09-02-phase-08-notifications-pwa.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-09-02-phase-08-notifications-pwa.md
          git commit -m "style(phase08): format implementation plan"
          git push origin HEAD:codex/phase-08-notifications
