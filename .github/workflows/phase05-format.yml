name: Phase 05 format

on:
  push:
    branches:
      - codex/phase-05-proposals

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-05-proposals
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 05 files
        run: |
          pnpm exec prettier --write \
            apps/web/scripts/phase-05-proposals-runtime.mjs \
            'apps/web/src/app/(account)/messages/[conversationId]/page.tsx' \
            'apps/web/src/app/(account)/messages/proposal-actions.ts' \
            apps/web/src/components/conversations/proposal-card.tsx \
            apps/web/src/components/conversations/proposal-composer.tsx \
            apps/web/src/lib/proposals/server.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web/scripts/phase-05-proposals-runtime.mjs \
            'apps/web/src/app/(account)/messages/[conversationId]/page.tsx' \
            'apps/web/src/app/(account)/messages/proposal-actions.ts' \
            apps/web/src/components/conversations/proposal-card.tsx \
            apps/web/src/components/conversations/proposal-composer.tsx \
            apps/web/src/lib/proposals/server.ts
          git commit -m 'style(phase05): format proposal implementation'
          git push origin HEAD:codex/phase-05-proposals
