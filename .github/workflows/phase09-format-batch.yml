name: Phase09 format batch

on:
  push:
    branches:
      - codex/phase09-format-batch

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 09 batch
        run: >-
          pnpm exec prettier --write
          apps/web/scripts/phase-09-trust-safety-runtime.mjs
          apps/web/src/app/admin/audit/page.tsx
          apps/web/src/app/admin/catalog/page.tsx
          apps/web/src/app/admin/identity/page.tsx
          apps/web/src/app/admin/jobs/page.tsx
          apps/web/src/app/admin/layout.tsx
          apps/web/src/app/admin/page.tsx
          apps/web/src/app/admin/providers/page.tsx
          apps/web/src/app/admin/reports/page.tsx
          apps/web/src/app/admin/users/page.tsx
          apps/web/src/lib/admin/policy.ts
          apps/web/src/lib/admin/server.ts
          tests/e2e/phase-09-admin-trust.spec.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name gabsvm
          git config user.email 53277787+gabsvm@users.noreply.github.com
          git add apps/web/scripts/phase-09-trust-safety-runtime.mjs apps/web/src/app/admin apps/web/src/lib/admin/policy.ts apps/web/src/lib/admin/server.ts tests/e2e/phase-09-admin-trust.spec.ts
          git commit -m "style(phase09): format implementation batch"
          git push
