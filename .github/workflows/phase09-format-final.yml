name: Phase09 format final

on:
  push:
    branches:
      - codex/phase09-format-final

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format final Phase 09 files
        run: >-
          pnpm exec prettier --write
          apps/web/src/app/admin/catalog/page.tsx
          tests/e2e/phase-09-admin-trust.spec.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name gabsvm
          git config user.email 53277787+gabsvm@users.noreply.github.com
          git add apps/web/src/app/admin/catalog/page.tsx tests/e2e/phase-09-admin-trust.spec.ts
          git commit -m "[skip ci] style(phase09): format final files"
          git push
