name: Phase 07 E2E format one-shot

on:
  push:
    branches:
      - codex/phase-07-reputation

permissions:
  contents: write

jobs:
  format-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/phase-07-reputation

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Phase 07 E2E and commit
        run: |
          pnpm exec prettier --write tests/e2e/phase-07-reputation.spec.ts
          git diff --check
          if git diff --quiet -- tests/e2e/phase-07-reputation.spec.ts; then
            echo "E2E already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/phase-07-reputation.spec.ts
          git commit -m "style(phase07): format reputation E2E"
          git push origin HEAD:codex/phase-07-reputation
