name: Phase 06 runtime format

on:
  push:
    branches:
      - codex/phase-06-jobs

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-06-jobs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/scripts/phase-06-jobs-runtime.mjs .github/workflows/ci.yml
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/scripts/phase-06-jobs-runtime.mjs .github/workflows/ci.yml
          git commit -m 'style(phase06): format runtime gate'
          git push origin HEAD:codex/phase-06-jobs
