name: Phase 10 Format Probe

on:
  push:
    branches:
      - codex/phase10-format-probe

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact Phase 10 files
        run: |
          pnpm exec prettier --write \
            apps/web/scripts/phase-10-beta-runtime.mjs \
            apps/web/scripts/phase-10-preview-smoke.mjs \
            apps/web/scripts/phase-10-seed-smoke.mjs \
            apps/web/src/lib/health.ts \
            apps/web/src/lib/observability.test.ts \
            tests/e2e/phase-10-beta-hardening.spec.ts
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/scripts/phase-10-beta-runtime.mjs \
            apps/web/scripts/phase-10-preview-smoke.mjs \
            apps/web/scripts/phase-10-seed-smoke.mjs \
            apps/web/src/lib/health.ts \
            apps/web/src/lib/observability.test.ts \
            tests/e2e/phase-10-beta-hardening.spec.ts
          git diff --cached --check
          git commit -m "chore(phase10): format probe output"
          git push origin HEAD:codex/phase10-format-probe
