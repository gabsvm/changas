name: Phase 09 format runtime

on:
  push:
    branches:
      - codex/phase-09-admin-trust

permissions:
  contents: write

jobs:
  format-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/scripts/phase-09-admin-runtime.mjs
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet -- apps/web/scripts/phase-09-admin-runtime.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/scripts/phase-09-admin-runtime.mjs
          git commit -m "style(phase09): format admin runtime"
          git push origin HEAD:codex/phase-09-admin-trust