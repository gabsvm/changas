name: Phase 11 Task 3 Format

on:
  push:

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[format-task3]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-11-payments
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Task 3 files
        run: pnpm exec prettier --write apps/web/src/lib/payments/crypto.test.ts apps/web/src/lib/payments/crypto.ts apps/web/src/lib/payments/oauth-state.test.ts apps/web/src/lib/payments/oauth-state.ts
      - name: Commit exact formatting and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/phase-11-format-task3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/payments/crypto.test.ts apps/web/src/lib/payments/crypto.ts apps/web/src/lib/payments/oauth-state.test.ts apps/web/src/lib/payments/oauth-state.ts .github/workflows/phase-11-format-task3.yml
          git commit -m "style(phase11): apply exact payment security formatting"
          git push origin HEAD:codex/phase-11-payments
