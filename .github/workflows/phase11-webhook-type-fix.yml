name: Phase 11 webhook type fix

on:
  push:
    branches:
      - codex/phase-11-payments

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'chore(phase11): apply webhook table typing fix' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile
      - name: Patch webhook table client typing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/lib/payments/webhook.ts')
          text = path.read_text()
          needle = '''type RpcClient = {\n  rpc(name: string, args?: Record<string, unknown>): PromiseLike<RpcResult>;\n};\n'''
          replacement = needle + '''\ntype TableSelectQuery = {\n  select(columns: string): TableSelectQuery;\n  eq(column: string, value: unknown): TableSelectQuery;\n  maybeSingle(): PromiseLike<RpcResult>;\n};\n\ntype TableClient = {\n  from(table: string): TableSelectQuery;\n};\n'''
          if needle not in text:
              raise SystemExit('RpcClient anchor not found')
          text = text.replace(needle, replacement, 1)
          count = text.count('const admin = createAdminClient();')
          if count != 3:
              raise SystemExit(f'expected 3 untyped admin reads, found {count}')
          text = text.replace(
              'const admin = createAdminClient();',
              'const admin = createAdminClient() as unknown as TableClient;',
          )
          path.write_text(text)
          PY
          pnpm exec prettier --write apps/web/src/lib/payments/webhook.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/payments/webhook.ts
          git commit -m "fix(phase11): type server-only webhook tables [skip patch]"
          git push origin HEAD:codex/phase-11-payments
