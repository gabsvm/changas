name: Phase 06 format

on:
  push:
    branches:
      - codex/phase-06-jobs

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-06-jobs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 06 files
        run: |
          pnpm exec prettier --write \
            docs/superpowers/plans/2026-09-01-phase-06-jobs.md \
            packages/domain/src/jobs.ts \
            packages/domain/src/jobs.test.ts \
            packages/domain/src/index.ts \
            apps/web/src/lib/jobs/server.ts \
            'apps/web/src/app/(account)/jobs/actions.ts' \
            'apps/web/src/app/(account)/jobs/page.tsx' \
            'apps/web/src/app/(account)/jobs/[jobId]/page.tsx'
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/superpowers/plans/2026-09-01-phase-06-jobs.md packages/domain/src/jobs.ts packages/domain/src/jobs.test.ts packages/domain/src/index.ts apps/web/src/lib/jobs/server.ts 'apps/web/src/app/(account)/jobs/actions.ts' 'apps/web/src/app/(account)/jobs/page.tsx' 'apps/web/src/app/(account)/jobs/[jobId]/page.tsx'
          git commit -m 'style(phase06): format jobs implementation'
          git push origin HEAD:codex/phase-06-jobs
