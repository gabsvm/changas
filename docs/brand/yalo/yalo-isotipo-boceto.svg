<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">YALO — boceto vectorial del isotipo (NO definitivo)</title>
  <desc id="desc">Aproximación conceptual basada en captura aportada: figura humana en Y, cabeza circular y brazos cian-turquesa-verde sobre fondo navy. No es calco ni archivo maestro oficial.</desc>
  <defs>
