    </linearGradient>
    <linearGradient id="right" x1="260" y1="330" x2="410" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12D9C5"/><stop offset="1" stop-color="#65EC91"/>
    </linearGradient>
    <linearGradient id="stem" x1="256" y1="265" x2="256" y2="401" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12D9C5"/><stop offset="1" stop-color="#12CABB"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0D121B"/>
  <g stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="54">
